<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Furniture | Order Now</title>
    <style>
        :root { --gold: #d4af37; --dark: #222; --white: #fff; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; }
        
        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; border-radius: 5px; }
        .price { font-weight: bold; color: var(--gold); font-size: 1.2em; margin: 10px 0; }
        
        /* Buttons */
        .btn-add { background: var(--dark); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%; }
        .btn-order { background: #25D366; color: white; border: none; padding: 15px 30px; cursor: pointer; border-radius: 5px; font-size: 1.1em; width: 100%; margin-top: 20px; }

        /* Cart Section */
        .cart-section { background: white; margin-top: 40px; padding: 20px; border-radius: 8px; border-top: 4px solid var(--gold); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<header>
    <h1>Online Furniture</h1>
    <p>Premium Craftsmanship | Hazaribagh</p>
</header>

<div class="container">
    <div class="grid">
        <div class="card">
            <img src="image_0.png" alt="Sofa">
            <h3>Premium L-Shape Sofa</h3>
            <p class="price">₹45,000</p>
            <button class="btn-add" onclick="addToCart('Premium L-Shape Sofa', 45000)">Add to Order</button>
        </div>
        <div class="card">
            <img src="image_2.png" alt="Sofa">
            <h3>Royal Curve Sleeper</h3>
            <p class="price">₹55,000</p>
            <button class="btn-add" onclick="addToCart('Royal Curve Sleeper', 55000)">Add to Order</button>
        </div>
    </div>

    <div class="cart-section">
        <h2>Your Order List</h2>
        <div id="cartItems">
            <p>No items added yet.</p>
        </div>
        <hr>
        <div style="font-size: 1.5em; font-weight: bold; text-align: right;">
            Total: ₹<span id="totalBill">0</span>
        </div>
        
        <input type="text" id="custName" placeholder="Your Name" style="width: 100%; padding: 10px; margin-top: 20px; box-sizing: border-box;">
        <button class="btn-order" onclick="placeOrder()">Place Order & Send Bill to WhatsApp</button>
    </div>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        cart.push({name, price});
        updateCartUI();
    }

    function updateCartUI() {
        const cartDiv = document.getElementById('cartItems');
        const totalSpan = document.getElementById('totalBill');
        cartDiv.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            cartDiv.innerHTML += `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <span>₹${item.price}</span>
                </div>`;
        });

        if (cart.length === 0) cartDiv.innerHTML = '<p>No items added yet.</p>';
        totalSpan.innerText = total.toLocaleString('en-IN');
    }

    function placeOrder() {
        const name = document.getElementById('custName').value;
        if (!name || cart.length === 0) {
            alert("Please add items and enter your name.");
            return;
        }

        let total = 0;
        let itemDetails = "";
        cart.forEach((item, i) => {
            itemDetails += `${i+1}. ${item.name} - ₹${item.price}\n`;
            total += item.price;
        });

        const message = `*NEW ORDER - ONLINE FURNITURE*\n\n*Customer:* ${name}\n\n*Items:*\n${itemDetails}\n*TOTAL BILL:* ₹${total}\n\n_Please confirm this order._`;
        
        // YOUR WHATSAPP NUMBER HERE
        const myNumber = "919905044663"; 
        const waLink = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
        
        window.open(waLink, '_blank');
    }
</script>

</body>
</html>
